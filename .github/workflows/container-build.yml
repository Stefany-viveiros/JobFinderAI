name: Container build

on:
  push:
    branches: ["infra/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: container-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: jobfinder-ai-api:test

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: Dockerfile
          push: false
          tags: jobfinder-ai-web:test
          build-args: |
            VITE_API_URL=/api
