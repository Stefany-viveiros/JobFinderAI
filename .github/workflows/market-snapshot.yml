name: Market Intelligence Snapshot

on:
  schedule:
    # Executa diariamente; o runner só cria snapshot quando completa 15 dias.
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-intelligence-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Criar snapshot se estiver na hora
        env:
          DATABASE_URL: ${{ secrets.MARKET_DATABASE_URL }}
        run: python -m jobfinder.market_snapshot_runner
